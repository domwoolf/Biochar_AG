# Journal-specific settings for Energy & Environmental Science (Royal Society of Chemistry).
# Use as `format: ees-pdf` / `ees-docx`; content and journal-agnostic options stay in BiomassTEA.qmd.
# Citation style: numbered superscripts (Vancouver form), CSL from the Citation Style Language
# repository (CC BY-SA 3.0).
title: Energy & Environmental Science
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      csl: royal-society-of-chemistry.csl
      filters:
        - cite-after-punct.lua
    pdf:
      # RSC article template: preamble packages, and front matter (header, title block, abstract,
      # affiliation footnotes, page setup) in place of Quarto's \maketitle
      pdf-engine: pdflatex
      documentclass: article
      classoption: [twoside, twocolumn, 9pt]
      papersize: letter
      geometry: [left=1.5cm, right=1.5cm, top=1.785cm, bottom=2.0cm]
      indent: true
      cite-method: natbib
      natbiboptions: "super,sort,compress,comma"
      biblio-style: rsc
      include-in-header: rsc-preamble.tex
      template-partials:
        - partials/before-body.tex
